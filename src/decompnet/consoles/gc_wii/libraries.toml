kind = "runtime"
home = "https://www.nxp.com/design/design-center/software/development-software/codewarrior-development-tools:CW_HOME"
# ansi_fp.c's table for __two_exp: 2 to the -64th's digits (printf's floating point)
strings = ['542101086242752217003726400434970855712890625']
names = ['__pformatter', '__sformatter', '__wpformatter', '__two_exp', '__ieee754_\w+', '__kernel_\w+',
         '__FileWrite', '__StringRead', '__StringWrite', '__wStringWrite', '__fwrite', '__flush_buffer',
         '__prep_buffer', '__flush_all', '__close_all', '__stdio_atexit', '__begin_critical_region',
         '__end_critical_region', '__kill_critical_regions', '__num2dec', '__num2dec_internal', '__dec2num',
         '__str2dec', '__strtold', '__strtoul', '__strtoull', '__ull2dec', '__timesdec', '__minus_dec', '__equals_dec',
         '__less_dec', '__count_trailing_zerol', '__memrchr', '__copy_longs_aligned', '__copy_longs_rev_aligned',
         '__copy_longs_unaligned', '__copy_longs_rev_unaligned', '__msl_\w+', '__fpclassifyd', '__fpclassifyf',
         '__signbitd', '__mbtowc_noconv', '__wctomb_noconv', '__pool_free', '__put_char', '__sinit_trigf_c',
         'parse_format', 'float2str', 'double2hex', 'long2str', 'longlong2str', 'round_decimal', 'Block_link',
         'SubBlock_merge_next', 'deallocate_from_fixed_pools', 'deallocate_from_var_pools', 'is_utf8_complete',
         'unicode_to_UTF8', '_fseek', '_ftell']
companion_names = ['abort', 'exit', 'abs', 'labs', 'div', 'atoi', 'rand', 'srand', 'raise', 'free', 'malloc',
                   'acos', 'acosf', 'asin', 'atan', 'atan2', 'ceil', 'copysign', 'cos', 'cosf', 'cos__Ff', 'exp',
                   'fabsf__Ff', 'floor', 'fmod', 'frexp', 'ldexp', 'log', 'log10', 'logf', 'modf', 'nan', 'pow',
                   'scalbn', 'sin', 'sinf', 'sin__Ff', 'sqrt', 'tan', 'tanf', 'fclose', 'fflush', 'fprintf', 'fputs',
                   'fseek', 'ftell', 'fwide', 'fwrite', 'printf', 'snprintf', 'sprintf', 'sscanf', 'vprintf',
                   'vsnprintf', 'vsprintf', 'swprintf', 'vswprintf', 'mbstowcs', 'mbtowc', 'wcstombs', 'memchr',
                   'memcmp', 'memmove', 'memcpy', 'memset', 'strcasecmp', 'strcat', 'strchr', 'strcmp', 'strcpy',
                   'stricmp', 'strlen', 'strncasecmp', 'strncmp', 'strncpy', 'strnicmp', 'strrchr', 'strstr',
                   'strtol', 'strtoul', 'tolower', 'toupper', 'wcschr', 'wcscmp', 'wcscpy', 'wcslen', 'wcsncpy',
                   'wmemchr', 'wmemcpy', '__read_console', '__write_console', '__close_console']
# its math is Sun's fdlibm, whose code compares a double's high word with these (built by lis/addi): e_exp's
# overflow and ln 2, e_pow's 2^31 and 2^64, e_rem_pio2's pi/4, 3pi/4 and 2^20 pi/2, k_tan's and s_atan's. dtk names
# none of it; in a GameCube game of 20,000 functions only exp, pow and __ieee754_rem_pio2 held two, and fourteen of
# the game's own one (pi/4 is anyone's): one counts only beside MSL's own code
constants = [0x40862e42, 0x3fd62e42, 0x3ff0a2b2, 0x41e00000, 0x43f00000, 0x3fe921fb, 0x4002d97c, 0x413921fb,
             0x3fe59428, 0x44100000]
needs = 2
companions = [0x3fe921fb, 0x4002d97c, 0x413921fb, 0x3fe59428, 0x44100000, 0x400f6a7a, 0x40874910]
companion_needs = 1
reach = 48
span = 0x4000
aside = true

