# Nintendo's SDK (OS, DVD, EXI, SI, NAND ... and its __start): found by dtk's signatures alone (sdk.py), no names (a
# game's own code calls its functions OSReport or DVDOpen too). Each of its libraries says which it is and when it was
# built: "<< Dolphin SDK - OS\trelease build: Apr  5 2004 04:14:49 (0x2301) >>", "<< RVL_SDK - DVD \trelease build:
# ...". Set aside as CodeWarrior's are: the decomps link Nintendo's, and agents spent time on it otherwise.
[[library]]
id = "dolphin-sdk"
name = "Nintendo's SDK (Dolphin and Revolution)"
kind = "sdk"
strings = ['<< (?:Dolphin SDK|RVL_SDK) - \w+\s+(?:release|debug) build: (?P<version>\w{3} [ \d]\d \d{4})']
aside = true
