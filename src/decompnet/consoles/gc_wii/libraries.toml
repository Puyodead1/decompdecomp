# CodeWarrior's own libraries, which every GameCube and Wii game links: the library finder's entries for them
# (libid/catalog.toml says what each key means; the console hands them over as Console.library_catalog).
#
# No one may publish their code, so no signature file of ours can find them: their names do. A game that kept its
# symbols has them, and dtk's own analysis names a few dozen in a stripped one (memcpy, __save_gpr, __pformatter,
# TRKNubMainLoop). dtk's own signatures (masked code, read from the installed dtk: sdk.py) find a few hundred more,
# CodeWarrior's and Nintendo's SDK's, by their code: each goes to the library below its name is in, the rest to the SDK.
# Each library is linked whole, one archive after the other: in five public decomps (GameCube and Wii) the runtime,
# MSL and MetroTRK are each one run of functions with nothing else inside, so the functions between two of one
# library's own named ones are its too, as far as `reach`. Their names here are the ones those decomps give the
# functions of their Runtime, MSL_C and TRK_MINNOW_DOLPHIN objects.
#
# `names` are the library's alone: a function so named is its, wherever it is. `companion_names` are also anyone's
# (strlen, sin, printf: a game may write its own): they count only beside the library's own functions.
#
# Set aside without asking (`aside`): this is the compiler's own code, never the game's, and a decomp links the
# compiler's copy instead of writing it. Three of eight functions an old judge falsely matched in a GameCube game
# were library code (MSL's __two_exp, MetroTRK's TRKDoWriteMemory, the SDK's GXGetVtxAttrFmt): agents spend their
# time on it otherwise. The user gives a function back in the Libraries panel, and it stays given back.

[[library]]
id = "mw-runtime"
name = "CodeWarrior's runtime (Runtime.PPCEABI)"
kind = "runtime"
home = "https://www.nxp.com/design/design-center/software/development-software/codewarrior-development-tools:CW_HOME"
strings = ['Metrowerks CW runtime library initializing default heap', 'GCN_Mem_Alloc\.c : InitDefaultHeap']
names = ['__save_gpr', '__restore_gpr', '__save_fpr', '__restore_fpr', '_savegpr_\d+', '_restgpr_\d+',
         '_savefpr_\d+', '_restfpr_\d+', '__div2u', '__div2i', '__mod2u', '__mod2i', '__shl2i', '__shr2i', '__shr2u',
         '__cvt_fp2unsigned', '__cvt_dbl_ull', '__cvt_dbl_usll', '__cvt_sll_flt', '__cvt_ull_dbl', '__cvt_ull_flt',
         '__cvt_sll_dbl', '__va_arg', '__ptmf_scall', '__ptmf_scall4', '__ptmf_cmpr', '__ptmf_test',
         '__construct_array', '__construct_new_array', '__destroy_arr', '__destroy_new_array',
         '__dt__26__partial_array_destructorFv', '__destroy_global_chain', '__register_global_object',
         '__init_cpp_exceptions', '__fini_cpp_exceptions', '__register_fragment', '__unregister_fragment',
         'GetR2(?:__Fv)?', '__fill_mem', '__copy', '__setjmp', '__longjmp', '__sys_alloc', '__sys_free']
companion_names = ['memcpy', 'memset']
reach = 48
span = 0x4000
aside = true

[[library]]
