# Libraries decompdecomp recognises in a game (libid/__init__.py reads this). One [[library]] per library:
#   id, name           what it's called (id: libs/<id>-<version> is where its source goes)
#   kind               "source": released as source, a decomp uses it; "middleware": no source anywhere;
#                      "algorithm": code everyone copies from one reference (MD5 from RFC 1321); "runtime": the
#                      compiler's own library (the console's import sets it aside by the compiler's own copy)
#   home               where it's from, for the user to read
#   download           its source for a version, {version} filled in (only where that address is reliable)
#   strings            regular expressions over the program's text, any one of which says it's there; a group
#                      named "version" gives its version
#   versions           regular expressions only read for its version once a `strings` one said it's there
#   constants          32-bit words its code holds (immediates or tables), each a fingerprint
#   needs              how many different `constants` one function must hold to be the library's
#   companions         words that alone say little (MD5's start values are SHA-1's too): a function holding
#                      `needs` of them counts only beside one of the library's own functions
#   bytes              byte strings its tables hold (AES's S-box), hex
#   aside              true: functions found by its constants are set aside as its code without asking

[[library]]
id = "md5"
name = "MD5 (RSA Data Security's reference code, RFC 1321)"
kind = "algorithm"
home = "https://www.rfc-editor.org/rfc/rfc1321"
strings = ['RSA Data Security, Inc\. MD5']
constants = [0xd76aa478, 0xe8c7b756, 0x242070db, 0xc1bdceee, 0xf57c0faf, 0x4787c62a, 0xa8304613, 0xfd469501,
             0x698098d8, 0x8b44f7af, 0xffff5bb1, 0x895cd7be, 0x6b901122, 0xfd987193, 0xa679438e, 0x49b40821]
needs = 4
companions = [0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476]
aside = true

